name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: masuda
      # 同じタグのmasuda-sandboxと組で配る（.claude/skills/release/SKILL.md）。契約の文面が合うことをここで確かめる。
      - uses: actions/checkout@v4
        with:
          repository: TadahiroYamamura/masuda-sandbox
          ref: ${{ github.ref_name }}
          path: masuda-sandbox

      - uses: actions/setup-go@v5
        with:
          go-version-file: masuda/go.mod
          cache-dependency-path: masuda/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid

      - name: Check versions
        id: versions
        working-directory: masuda
        run: |
          tag="$GITHUB_REF_NAME"
          engine=$(go list -m -f '{{.Version}}' github.com/TadahiroYamamura/masuda-engine)
          if [ "$engine" != "$tag" ]; then
            echo "go.mod requires masuda-engine $engine, but the release tag is $tag (go get github.com/TadahiroYamamura/masuda-engine@$tag)" >&2
            exit 1
          fi
          # 注釈付きタグなら^{}の行がコミット、軽量タグなら唯一の行がコミット。
          refs=$(git ls-remote https://github.com/TadahiroYamamura/masuda-engine.git "refs/tags/$tag" "refs/tags/$tag^{}")
          engine_commit=$(echo "$refs" | awk -v t="refs/tags/$tag^{}" '$2 == t { print $1 }')
          [ -n "$engine_commit" ] || engine_commit=$(echo "$refs" | awk 'NR == 1 { print $1 }')
          sandbox_commit=$(git -C ../masuda-sandbox rev-parse HEAD)
          # 検証したClaude Codeの版はinternal/guest.ClaudeCodeVersion。定数を直接grepせず`masuda version`の
          # 表示から取るのは、利用者が見るものとノートを同じ出どころにするため（sandboxに繋がらなくても0で終わる）。
          claude_code=$(go run ./cmd/masuda version --sandbox-socket /nonexistent/none.sock 2>/dev/null \
            | sed -n 's/^  claude code: \([^ ]*\) (guest, verified)$/\1/p')
          if [ -z "$claude_code" ]; then
            echo "masuda version did not print the verified Claude Code version" >&2
            exit 1
          fi
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"
          {
            echo "masuda $tag"
            echo
            echo "| | tag | commit |"
            echo "|---|---|---|"
            echo "| masuda | $tag | $GITHUB_SHA |"
            echo "| masuda-engine | $tag | $engine_commit |"
            echo "| masuda-sandbox | $tag | $sandbox_commit |"
            echo
            echo "ゲストのClaude Code: $claude_code で実機検証した（\`masuda init\`の雛形のDockerfileがこの版を入れる）。"
            echo
            echo "masuda-sandboxは同じタグのReleaseのtgzを入れる。手順は docs/user/install.md。macOS（darwin/arm64）は実験的。"
          } >../release-notes.md
          cat ../release-notes.md

      # フェイクsandboxは特権コマンドを`unshare -Urm`（非特権のユーザー名前空間）で動かす。
      # Ubuntu 24.04のランナーはAppArmorがこれを禁じている（uid_mapへの書き込みがEPERM）ので、テストの前に解く。
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Vet and test
        working-directory: masuda
        run: |
          go vet ./...
          go test ./...

      - name: Contract matches masuda-sandbox at the same tag
        working-directory: masuda
        run: |
          go generate ./internal/sandboxcontract/
          git diff --exit-code -- internal/sandboxcontract/

      - name: Build
        working-directory: masuda
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          mkdir -p ../dist
          for target in linux/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="masuda_${VERSION}_${os}_${arch}"
            mkdir -p "../dist/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "../dist/$name/masuda" ./cmd/masuda
            cp README.md "../dist/$name/"
            tar -C ../dist -czf "../dist/$name.tar.gz" "$name"
            rm -r "../dist/$name"
          done

      # clients/tsのpackage.jsonの版はタグから書き込む（npmレジストリには公開しない）。
      - name: Pack clients/ts
        working-directory: masuda/clients/ts
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          npm pkg set version="$VERSION"
          npm pack --pack-destination ../../../dist

      - name: Installer
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          perl -pe 's/__MASUDA_VERSION__/$ENV{VERSION}/g' masuda/scripts/install.sh >dist/masuda_installer.sh
          chmod 0755 dist/masuda_installer.sh

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum *.tar.gz *.tgz masuda_installer.sh >SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.tgz
            dist/masuda_installer.sh
            dist/SHA256SUMS
