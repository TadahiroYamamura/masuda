name: Release

# masuda currently only supports Linux (no Mac support yet), so the release
# matrix is linux/amd64 and linux/arm64 only.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build masuda_${{ matrix.goos }}_${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        # -X main.version embeds the pushed tag (ADR-0032) so `masuda
        # update`/`masuda --version` can identify this build; local `make
        # build` deliberately leaves it at the "dev" default.
        run: go build -trimpath -ldflags "-X main.version=${{ github.ref_name }}" -o "masuda_${{ matrix.goos }}_${{ matrix.goarch }}" ./cmd/masuda

      - uses: actions/upload-artifact@v4
        with:
          name: masuda_${{ matrix.goos }}_${{ matrix.goarch }}
          path: masuda_${{ matrix.goos }}_${{ matrix.goarch }}
          if-no-files-found: error

  # Zips internal/perspectives/builtin/*.md as a release asset (ADR-0033):
  # masuda no longer go:embeds these into the CLI binary, since a `masuda
  # update` in the same process that just replaced the binary on disk still
  # runs on the *old* binary's embedded set (Unix rename doesn't touch a
  # running process's memory) -- fetching from the release avoids that lag.
  reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip built-in review perspectives
        run: (cd internal/perspectives/builtin && zip -r ../../../masuda_reviews.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: masuda_reviews
          path: masuda_reviews.zip
          if-no-files-found: error

  release:
    needs: [build, reviews]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # gh release create + upload --clobber (rather than failing outright)
      # so a re-run of this workflow for the same tag (e.g. after a
      # transient failure) doesn't need the tag deleted and re-pushed first.
      - name: Publish release with binaries attached
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --clobber

  # Publishes the sandbox base image (repo-root Dockerfile) to the public
  # tadahiroyamamura/masuda Docker Hub repo (ADR-0032). Independent of
  # build/release above -- the base image doesn't consume the Go binaries --
  # so it isn't gated behind them.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login --username tadahiroyamamura --password-stdin

      - name: Build and push masuda base image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t tadahiroyamamura/masuda:${{ github.ref_name }} \
            -t tadahiroyamamura/masuda:latest \
            --push .
