name: AI PR Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  review:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '@ai/review') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch PR metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }}
          --json title,body,comments,baseRefOid,headRefOid > pr_meta.json

      - name: Compute diff
        run: git diff "$(jq -r .baseRefOid pr_meta.json)" "$(jq -r .headRefOid pr_meta.json)" > pr.diff

      - name: Render PR context
        run: python render_pr_context.py --meta pr_meta.json --diff pr.diff -o pr_context.md

      - name: Run review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python langgraph_orchestrator.py --pr-file pr_context.md

      - name: Upload review results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-results
          path: review_results/
